<mat-sidenav-container class="admin-container">
  <mat-sidenav #sidenav class="sidebar" [mode]="isMobile ? 'over' : 'side'" [fixedInViewport]="isMobile"
    [autoFocus]="false">
    <div class="logo-section">
      <mat-icon>medical_services</mat-icon>
      <span>Clinic Admin</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/enquiries" routerLinkActive="active-link">
        <mat-icon matListItemIcon>chat_bubble_outline</mat-icon>
        <span matListItemTitle>Enquiries</span>
      </a>
      <a mat-list-item routerLink="/patients-list" routerLinkActive="active-link">
        <mat-icon matListItemIcon>person_outline</mat-icon>
        <span matListItemTitle>Patients</span>
      </a>
      <a mat-list-item routerLink="/visits" routerLinkActive="active-link">
        <mat-icon matListItemIcon>medical_information</mat-icon>
        <span matListItemTitle>Visits</span>
      </a>
      <a mat-list-item routerLink="/prescriptions" routerLinkActive="active-link">
        <mat-icon matListItemIcon>medication</mat-icon>
        <span matListItemTitle>Prescriptions</span>
      </a>
      <a mat-list-item routerLink="/therapies" routerLinkActive="active-link">
        <mat-icon matListItemIcon>psychology</mat-icon>
        <span matListItemTitle>Therapies</span>
      </a>
      <a mat-list-item routerLink="/reports" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assessment</mat-icon>
        <span matListItemTitle>Reports</span>
      </a>
      <a mat-list-item routerLink="/settings" routerLinkActive="active-link">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Settings</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <header class="top-header">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="spacer"></span>
      <button mat-icon-button matTooltip="Notifications">
        <mat-icon>notifications_none</mat-icon>
      </button>
      <button mat-icon-button (click)="logout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
      <button mat-flat-button color="primary" class="add-patient-btn" routerLink="/add-patient">
        <mat-icon>add</mat-icon> Add Patient
      </button>
    </header>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
